[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "reflect-lite-research"
version = "0.1.0"
description = "Bounded experiments for Reflect-style physical-AI interfaces"
readme = "Reflect Lite Research Program.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.3,<3",
  "pyarrow>=21,<22",
  "PyYAML>=6.0.2,<7",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.hatch.build.targets.wheel]
packages = ["reflect"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
