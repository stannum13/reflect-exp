<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Reflect Lite evidence disposition, 24 August 2026</title>
  <desc id="desc">Counts derived one row per experiment from cross-experiment-evidence.csv: six accepted bounded evidence, two approved bounded invalid archives, one rejected, and one not run.</desc>
  <!-- Reconstruction contract: group rows by plot_group; count rows; order by plot_order; fill with plot_color. No experimental effect sizes are pooled or compared. -->
