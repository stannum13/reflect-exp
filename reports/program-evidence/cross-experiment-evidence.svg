  <text x="60" y="58" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#182230">Program evidence disposition</text>
  <text x="60" y="88" font-family="system-ui, sans-serif" font-size="15" fill="#475467">Ten bounded workstreams; status counts only—not a quality score or pooled effect</text>
  <line x1="300" y1="424" x2="900" y2="424" stroke="#98a2b3" stroke-width="1"/>
  <line x1="300" y1="128" x2="300" y2="424" stroke="#98a2b3" stroke-width="1"/>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#667085">
