  <line x1="300" y1="424" x2="940" y2="424" stroke="#98a2b3" stroke-width="1"/>
  <line x1="300" y1="128" x2="300" y2="424" stroke="#98a2b3" stroke-width="1"/>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#667085">
